[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refined-types"
version = "0.0.1"
description = "Annotated-based refinement types for Python — with first-class Pydantic v2 integration. A practical projection of Σ-types into a language without dependent types."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ivan Zakutnii", email = "ivan.zakutnii@weareocta.com" }]
requires-python = ">=3.10"
keywords = [
    "refined-types",
    "refinement-types",
    "phantom-types",
    "pydantic",
    "sigma-types",
    "subset-types",
    "predicate-types",
    "parse-dont-validate",
    "type-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
hypothesis = ["hypothesis>=6.0"]
all = [
    "pydantic>=2.0",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/m0n0x41d/refined-types"
Repository = "https://github.com/m0n0x41d/refined-types"
Issues = "https://github.com/m0n0x41d/refined-types/issues"
Changelog = "https://github.com/m0n0x41d/refined-types/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/refined_types"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pyright>=1.1.380",
    "ruff>=0.5",
    "pydantic>=2.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_redundant_casts = false
warn_unused_ignores = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"
